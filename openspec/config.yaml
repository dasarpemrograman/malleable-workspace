schema: spec-driven

context: |
  Malleable Workspace is an implemented npm/Node 24 and TypeScript application:
  React client assets and a versioned HTTP API served by Cloudflare Workers,
  with one SQLite-backed Workspace Durable Object bound as WORKSPACE and routed
  by the fixed primary object name. Local Wrangler operation needs no cloud login.
  Preserve stable resource IDs, API/snapshot formats, token authorization,
  signed webhook bytes, delivery budgets, storage identity and migration history.
  Hosted upgrades use reviewed source imports and guarded deployment; local
  contribution checks must not deploy or access production secrets or data.
  API, MCP and ACP are distinct protocols; no MCP/ACP adapter is implemented.
  Use Scoped Commits (scope: description). Keep contributor docs and focused
  tests aligned with module ownership. Proposal workflows authorize planning
  only; implementation requires a separate apply request, and deploying requires
  explicit operator intent. Historical acceptance records are not new test runs.

rules:
  proposal:
    - Distinguish confirmed user requirements from proposed defaults and open questions.
  design:
    - Explain how customization affects published contracts and existing connections.
    - Address data ownership, permissions, migration, and recovery.
  specs:
    - Give observable scenarios for inbound and outbound interactions.
